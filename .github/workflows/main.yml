on:
  push:
    branches: [main]

name: Deploy on push

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build Project
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Save build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Get build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Sync files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HOST: sleeplessjade.com
          PORT: "21098"
          KNOWN_HOST: "[sleeplessjade.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHvc8C+ehlK4VCq02tIS0rNhHTiaejwKZCtBias7gjG2"
        run: |
          [[ -f dist/index.html ]] || { echo "::error::dist/index.html is missing; not deploying."; exit 1; }

          key="$RUNNER_TEMP/deploy_key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$key")
          printf '%s\n' "$KNOWN_HOST" > "$RUNNER_TEMP/known_hosts"
          ssh=(ssh -p "$PORT" -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts")

          rsync -rltcvz --delete \
            --exclude=/.well-known/ --exclude=/cgi-bin/ --exclude=/.ftpquota \
            -e "${ssh[*]}" dist/ "$DEPLOY_USER@$HOST:"

          if out=$("${ssh[@]}" "$DEPLOY_USER@$HOST" true 2>&1) || [[ $out != *"is not rsync"* ]]; then
            echo "::error::The deploy key isn't restricted to rsync on the server. Check ~/.ssh/authorized_keys."
            exit 1
          fi
          echo "Deploy key is still restricted to rsync."

name: pr-checks

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly: security only, to catch new CVEs in unchanged lockfiles
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    uses: mrcastle/ci-workflows/.github/workflows/node.yml@8778df5021ec9cf83980bee131e549871b08ead0 # feat/per-check-jobs (pre-release)
    with:
      node-version: "24"
      checks: |
        lint: npm run lint
        typecheck: npx tsc -b
        build: npm run build

  security:
    permissions:
      contents: read
      actions: read
    uses: mrcastle/ci-workflows/.github/workflows/security.yml@8778df5021ec9cf83980bee131e549871b08ead0 # feat/per-check-jobs (pre-release)

  report:
    needs: [ci, security]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      pull-requests: write
    uses: mrcastle/ci-workflows/.github/workflows/report.yml@8778df5021ec9cf83980bee131e549871b08ead0 # feat/per-check-jobs (pre-release)

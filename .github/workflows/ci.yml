name: CI

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly, to catch new CVEs in unchanged lockfiles
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    permissions:
      contents: read
      actions: read # zizmor online audits
      pull-requests: write # report comment
    uses: mrcastle/ci-workflows/.github/workflows/node.yml@8a2faba8cc872350b6af9f4846a51c9b258bc180 # feat/per-check-jobs (pre-release)
    with:
      node-version: "24"
      lint: npm run lint
      typecheck: npx tsc -b
      build: npm run build
